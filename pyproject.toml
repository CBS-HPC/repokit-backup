[build-system]
requires = [
    "setuptools>=77",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "repokit-backup"
version = "1.0.0"
description = "Backup and sync CLI for Repokit"
readme = "README.md"
authors = [
    { name = "CBS-HPC" },
]
keywords = [
    "research",
    "reproducibility",
    "automation",
    "data-management",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31,<3",
    "repokit-common>=0.1.0,<=1.0.0",
]
requires-python = ">=3.10"

license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/CBS-HPC/repokit-backup"
Repository = "https://github.com/CBS-HPC/repokit-backup"
Issues = "https://github.com/CBS-HPC/repokit-backup/issues"

[project.optional-dependencies]
dev = [
    "build==1.4.0",
    "mypy==1.18.2",
    "pytest==9.0.2",
    "ruff==0.14.0",
]

[project.scripts]
backup = "repokit_backup.cli:main"
repokit-backup = "repokit_backup.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
strict_optional = false
exclude = "(^\\.venv/|^build/|^dist/)"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.datasets]
patterns = "C:\\data\\*"
