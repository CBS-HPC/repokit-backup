name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CBS-HPC/repokit-common
          path: repokit-common
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ./repokit-common --no-deps
      - run: pip install -e . --no-deps
      - run: pip install "requests>=2.31,<3" build==1.4.0 mypy==1.18.2 pytest==9.0.2 ruff==0.14.0
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest
      - run: python -m build --outdir tmp/ci-build
      - run: python -m pip install --no-deps tmp/ci-build/*.whl
        shell: bash
        if: runner.os != 'Windows'
      - run: |
          $wheel = Get-ChildItem tmp\ci-build\*.whl | Select-Object -First 1
          python -m pip install --no-deps $wheel.FullName
        shell: pwsh
        if: runner.os == 'Windows'
      - run: repokit-backup --help
      - run: python -m repokit_backup --help
